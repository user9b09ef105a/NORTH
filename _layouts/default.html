<!doctype html>
{% assign initial_lang = page.lang | default: site.default_lang | default: 'en' %}
<html lang="{{ initial_lang }}" dir="{% if initial_lang == 'fa' %}rtl{% else %}ltr{% endif %}" data-active-lang="{{ initial_lang }}" data-theme="ocean">
{% include head.html %}
<body data-baseurl="{{ site.baseurl }}" data-page-lang="{{ page.lang | default: '' }}">
  {% include header.html %}
  <main id="content" class="main">{{ content }}</main>
  {% include footer.html %}
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  <script>window.addEventListener('load',function(){var start=function(){var s=document.createElement('script');s.src={{ '/assets/js/intelligence.js' | relative_url | jsonify }};s.defer=true;s.dataset.northEnhancement='intelligence';document.body.appendChild(s)};if('requestIdleCallback' in window){requestIdleCallback(start,{timeout:1400})}else{setTimeout(start,260)}},{once:true});</script>
</body>
</html>
